<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>bob and his frens</title>
    <style>
        /* Applied to both html and body to strictly lock the viewport */
        html, body {
            margin: 0;
            padding: 0;
            background-color: #a3d9e8; 
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
            
            /* Prevents mobile pull-to-refresh, pinch-zoom, and swipe scrolling */
            touch-action: none; 
            /* Locks the body in place to stop bounce scrolling (rubber-banding) */
            position: fixed; 
            
            cursor: pointer; 
        }

        .scrolling-wrapper {
            display: flex;
            width: max-content; 
            height: 100vh;
            animation: pan-horizontal 30s linear infinite;
        }

        .scrolling-wrapper img {
            height: 100vh; 
            width: auto;   
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
            
            /* Stops users from accidentally dragging or highlighting the image */
            user-select: none;
            -webkit-user-drag: none;
            /* Ensures clicks always register on the background to start the music */
            pointer-events: none; 
        }

        .scrolling-wrapper::before {
            content: "Image not found! Ensure loop.png is uploaded to the same folder as this HTML file.";
            position: absolute;
            top: 50%;
            left: 20px;
            font-family: sans-serif;
            font-size: 24px;
            color: black;
            z-index: -1;
        }

        @keyframes pan-horizontal {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <div class="scrolling-wrapper">
        <img src="loop.png" alt="" draggable="false">
        <img src="loop.png" alt="" draggable="false">
    </div>

    <audio id="bg-music" src="bob.mp3" loop></audio>

    <script>
        // Listens for a click or tap anywhere on the screen
        document.body.addEventListener('click', function() {
            var audio = document.getElementById('bg-music');
            if (audio.paused) {
                audio.play();
            }
        });
        
        // Secondary safeguard to block touch-move scrolling on older mobile browsers
        document.body.addEventListener('touchmove', function(event) {
            event.preventDefault();
        }, { passive: false });
    </script>

</body>
</html>
