<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bob and his frens</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #a3d9e8; 
            height: 100vh;
            width: 100vw;
            overflow: hidden; 
        }

        .scrolling-wrapper {
            display: flex;
            width: max-content; 
            height: 100vh;
            animation: pan-horizontal 30s linear infinite;
        }

        .scrolling-wrapper img {
            height: 100vh; 
            width: auto;   
            image-rendering: -moz-crisp-edges;
            image-rendering: -o-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        /* Generic fallback text for the live website */
        .scrolling-wrapper::before {
            content: "Image not found! Ensure loop.png is uploaded to the same folder as this HTML file.";
            position: absolute;
            top: 50%;
            left: 20px;
            font-family: sans-serif;
            font-size: 24px;
            color: black;
            z-index: -1;
        }

        @keyframes pan-horizontal {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
    </style>
</head>
<body>

    <div class="scrolling-wrapper">
        <img src="loop.png" alt="">
        <img src="loop.png" alt="">
    </div>

</body>
</html>
