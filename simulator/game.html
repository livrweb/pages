<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Animal World - Touch Edition</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #1a1a1a;
            font-family: sans-serif;
            overflow: hidden;
            touch-action: none; /* Prevents scrolling while playing */
        }

        #game-container {
            position: relative;
            width: 100%;
            height: 100%;
            max-width: 800px;
            max-height: 600px;
        }

        canvas {
            background-color: #2ecc71;
            width: 100%;
            height: 100%;
            display: block;
            touch-action: none;
        }

        /* Virtual Joystick Styles */
        #joystick-container {
            position: absolute;
            bottom: 40px;
            left: 40px;
            width: 120px;
            height: 120px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: none; /* Hidden by default, shown on touch */
            border: 2px solid rgba(255, 255, 255, 0.4);
        }

        #joystick-knob {
            position: absolute;
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.8);
            border-radius: 50%;
            top: 35px;
            left: 35px;
        }

        #ui {
            position: absolute;
            top: 10px;
            left: 10px;
            color: white;
            pointer-events: none;
            text-shadow: 2px 2px 2px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="ui">
            <div style="font-weight: bold; font-size: 18px;">SUPER ANIMAL WORLD</div>
            <div id="status">Touch Screen to Move</div>
        </div>
        <canvas id="gameCanvas"></canvas>
        
        <div id="joystick-container">
            <div id="joystick-knob"></div>
        </div>
    </div>

<script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const joystick = document.getElementById('joystick-container');
    const knob = document.getElementById('joystick-knob');

    canvas.width = 800;
    canvas.height = 600;

    // --- Input Management ---
    const input = { x: 0, y: 0, active: false };
    const keys = {};

    // Mouse/Keyboard fallbacks
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    // Touch Handling
    let touchStartX = 0;
    let touchStartY = 0;

    window.addEventListener('touchstart', e => {
        const touch = e.touches[0];
        input.active = true;
        touchStartX = touch.clientX;
        touchStartY = touch.clientY;
        
        // Position and show joystick
        joystick.style.display = 'block';
        joystick.style.left = `${touchStartX - 60}px`;
        joystick.style.top = `${touchStartY - 60}px`;
    });

    window.addEventListener('touchmove', e => {
        if (!input.active) return;
        const touch = e.touches[0];
        const dx = touch.clientX - touchStartX;
        const dy = touch.clientY - touchStartY;
        const dist = Math.sqrt(dx*dx + dy*dy);
        const maxRadius = 40;

        // Normalize and clamp movement
        const angle = Math.atan2(dy, dx);
        const clampedDist = Math.min(dist, maxRadius);
        
        input.x = (Math.cos(angle) * clampedDist) / maxRadius;
        input.y = (Math.sin(angle) * clampedDist) / maxRadius;

        // Move visual knob
        knob.style.transform = `translate(${input.x * maxRadius}px, ${input.y * maxRadius}px)`;
    });

    window.addEventListener('touchend', () => {
        input.active = false;
        input.x = 0;
        input.y = 0;
        joystick.style.display = 'none';
        knob.style.transform = `translate(0,0)`;
    });

    class Animal {
        constructor(x, y, color) {
            this.x = x;
            this.y = y;
            this.size = 40;
            this.color = color;
            this.speed = 5;
        }

        draw() {
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x, this.y, this.size, this.size);
            
            // Cute details
            ctx.fillStyle = "black";
            ctx.fillRect(this.x + 8, this.y + 10, 6, 6);
            ctx.fillRect(this.x + 26, this.y + 10, 6, 6);
        }

        update() {
            // Priority 1: Touch Input
            if (input.active) {
                this.x += input.x * this.speed;
                this.y += input.y * this.speed;
            } 
            // Priority 2: Keyboard Input
            else {
                if (keys['ArrowUp'] || keys['KeyW']) this.y -= this.speed;
                if (keys['ArrowDown'] || keys['KeyS']) this.y += this.speed;
                if (keys['ArrowLeft'] || keys['KeyA']) this.x -= this.speed;
                if (keys['ArrowRight'] || keys['KeyD']) this.x += this.speed;
            }

            // Bound checks
            this.x = Math.max(0, Math.min(canvas.width - this.size, this.x));
            this.y = Math.max(0, Math.min(canvas.height - this.size, this.y));
        }
    }

    const player = new Animal(canvas.width/2, canvas.height/2, '#e67e22');

    function gameLoop() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        // Background detail
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        for(let i=0; i<canvas.width; i+=80) {
            for(let j=0; j<canvas.height; j+=80) {
                ctx.fillRect(i, j, 2, 2);
            }
        }

        player.update();
        player.draw();

        requestAnimationFrame(gameLoop);
    }

    gameLoop();
</script>
</body>
</html>
