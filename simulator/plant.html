<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Plant Breeding Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }
        body {
            background-color: #eef7f2;
            color: #2c3e50;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 10px;
        }
        .container {
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            margin-bottom: 20px;
        }
        header {
            background: #27ae60;
            color: white;
            padding: 15px;
            text-align: center;
            font-size: 1.3rem;
            font-weight: bold;
        }
        .tabs {
            display: flex;
            background: #2ecc71;
        }
        .tab-btn {
            flex: 1;
            padding: 12px;
            background: none;
            border: none;
            color: white;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .tab-btn.active {
            background: #27ae60;
            border-bottom: 4px solid #fff;
        }
        .content {
            padding: 15px;
            flex: 1;
            overflow-y: auto;
            max-height: 60vh;
        }
        .section {
            display: none;
        }
        .section.active {
            display: block;
        }
        /* Breeding Lab */
        .lab-area {
            display: flex;
            justify-content: space-around;
            align-items: center;
            margin-bottom: 20px;
            background: #f9f9f9;
            padding: 15px;
            border-radius: 12px;
            border: 2px dashed #bdc3c7;
        }
        .slot {
            width: 80px;
            height: 80px;
            border: 2px solid #27ae60;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #fff;
            cursor: pointer;
            position: relative;
        }
        .slot span {
            font-size: 2rem;
        }
        .slot-label {
            font-size: 0.75rem;
            color: #7f8c8d;
            margin-top: 5px;
        }
        .plus-sign {
            font-size: 1.5rem;
            font-weight: bold;
            color: #7f8c8d;
        }
        .breed-btn {
            width: 100%;
            padding: 14px;
            background: #e67e22;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: background 0.2s;
        }
        .breed-btn:active {
            background: #d35400;
        }
        .breed-btn:disabled {
            background: #bdc3c7;
            cursor: not-allowed;
        }
        /* Inventory / Plant Grid */
        h3 {
            margin-bottom: 10px;
            font-size: 1rem;
            color: #34495e;
        }
        .plant-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }
        .plant-card {
            background: #fdfdfd;
            border: 1px solid #e0e0e0;
            border-radius: 10px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.1s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 90px;
        }
        .plant-card:active {
            transform: scale(0.95);
        }
        .plant-card.selected {
            border-color: #27ae60;
            background: #e8f8f0;
            box-shadow: 0 0 5px rgba(39, 174, 96, 0.4);
        }
        .plant-emoji {
            font-size: 2rem;
            margin-bottom: 4px;
        }
        .plant-name {
            font-size: 0.8rem;
            font-weight: 600;
        }
        /* Result Modal/Banner */
        #result-box {
            text-align: center;
            padding: 15px;
            background: #e8f8f0;
            border: 2px solid #27ae60;
            border-radius: 10px;
            margin-top: 15px;
            display: none;
        }
        #result-box h4 {
            color: #27ae60;
            margin-bottom: 5px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>🌿 Plant Breeding Simulator</header>
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('lab')">Lab</button>
            <button class="tab-btn" onclick="switchTab('greenhouse')">Greenhouse (<span id="unlocked-count">4</span>/15)</button>
        </div>

        <div class="content">
            <!-- LAB SECTION -->
            <div id="lab-section" class="section active">
                <h3>Select Two Plants to Breed:</h3>
                <div class="lab-area">
                    <div class="slot" id="slot-0" onclick="clearSlot(0)">
                        <span id="slot-0-emoji">🌱</span>
                        <div class="slot-label">Slot 1</div>
                    </div>
                    <div class="plus-sign">+</div>
                    <div class="slot" id="slot-1" onclick="clearSlot(1)">
                        <span id="slot-1-emoji">🌱</span>
                        <div class="slot-label">Slot 2</div>
                    </div>
                </div>

                <button class="breed-btn" id="breed-action-btn" onclick="breedPlants()" disabled>Cross Breed!</button>

                <div id="result-box">
                    <h4 id="result-title">New Discovery!</h4>
                    <p id="result-desc">You bred a Peage!</p>
                </div>

                <h3 style="margin-top: 20px;">Your Available Plants:</h3>
                <div class="plant-grid" id="lab-inventory">
                    <!-- Dynamic inventory -->
                </div>
            </div>

            <!-- GREENHOUSE SECTION -->
            <div id="greenhouse-section" class="section">
                <h3>Discovered Plants Collection:</h3>
                <div class="plant-grid" id="greenhouse-grid">
                    <!-- Dynamic collection -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Plant Database
        const plants = {
            peapod: { name: "Peapod", emoji: "🫛", type: "base", desc: "A crisp pod full of fresh green peas." },
            cabbage: { name: "Cabbage", emoji: "🥬", type: "base", desc: "A leafy green head of crunchiness." },
            tomato: { name: "Tomato", emoji: "🍅", type: "base", desc: "Juicy red garden classic." },
            berry: { name: "Berry", emoji: "🫐", type: "base", desc: "Sweet little blue spheres." },
            
            // Hybrids
            peage: { name: "Peage", emoji: "🥗", type: "hybrid", desc: "Peapod + Cabbage: A crunchy salad fusion!" },
            cabbato: { name: "Cabbato", emoji: "🥘", type: "hybrid", desc: "Cabbage + Tomato: Great for robust vegetable stews." },
            tomaberry: { name: "Tomaberry", emoji: "🍒", type: "hybrid", desc: "Tomato + Berry: A bizarre sweet-savory cocktail fruit." },
            peaberry: { name: "Peaberry", emoji: "🫘", type: "hybrid", desc: "Peapod + Berry: Packed with natural protein and sugar." },
            supersalad: { name: "Super Salad", emoji: "🍲", type: "hybrid", desc: "Peage + Cabbato: The ultimate leafy masterpiece." },
            berrypod: { name: "Berrypod", emoji: "🪻", type: "hybrid", desc: "Peaberry + Peage: A gorgeous flowering vine." }
        };

        // Breeding Recipes (Order-independent keys using sorted combination strings)
        const recipes = {
            "cabbage+peapod": "peage",
            "cabbage+tomato": "cabbato",
            "berry+tomato": "tomaberry",
            "berry+peapod": "peaberry",
            "cabbato+peage": "supersalad",
            "peaberry+peage": "berrypod"
        };

        // Game State
        let inventory = ["peapod", "cabbage", "tomato", "berry"];
        let unlocked = ["peapod", "cabbage", "tomato", "berry"];
        let selectedSlots = [null, null];

        function switchTab(tabName) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            
            if (tabName === 'lab') {
                document.querySelector('.tab-btn:nth-child(1)').classList.add('active');
                document.getElementById('lab-section').classList.add('active');
            } else {
                document.querySelector('.tab-btn:nth-child(2)').classList.add('active');
                document.getElementById('greenhouse-section').classList.add('active');
                renderGreenhouse();
            }
        }

        function selectPlant(id) {
            // Check if already in slot
            if (selectedSlots[0] === id) {
                selectedSlots[0] = null;
            } else if (selectedSlots[1] === id) {
                selectedSlots[1] = null;
            } else if (selectedSlots[0] === null) {
                selectedSlots[0] = id;
            } else if (selectedSlots[1] === null) {
                selectedSlots[1] = id;
            } else {
                // Replace slot 1 if both full
                selectedSlots[0] = id;
            }
            updateLabUI();
        }

        function clearSlot(index) {
            selectedSlots[index] = null;
            updateLabUI();
        }

        function updateLabUI() {
            // Slots
            document.getElementById('slot-0-emoji').innerText = selectedSlots[0] ? plants[selectedSlots[0]].emoji : '🌱';
            document.getElementById('slot-1-emoji').innerText = selectedSlots[1] ? plants[selectedSlots[1]].emoji : '🌱';

            // Breed button check
            const btn = document.getElementById('breed-action-btn');
            if (selectedSlots[0] && selectedSlots[1]) {
                btn.removeAttribute('disabled');
            } else {
                btn.setAttribute('disabled', 'true');
            }

            // Render Lab Inventory Cards
            const grid = document.getElementById('lab-inventory');
            grid.innerHTML = '';
            inventory.forEach(id => {
                const p = plants[id];
                const isSelected = selectedSlots.includes(id) ? 'selected' : '';
                grid.innerHTML += `
                    <div class="plant-card ${isSelected}" onclick="selectPlant('${id}')">
                        <div class="plant-emoji">${p.emoji}</div>
                        <div class="plant-name">${p.name}</div>
                    </div>
                `;
            });

            document.getElementById('unlocked-count').innerText = unlocked.length;
        }

        function breedPlants() {
            if (!selectedSlots[0] || !selectedSlots[1]) return;

            const p1 = selectedSlots[0];
            const p2 = selectedSlots[1];
            
            // Create sorted combo key
            const comboKey = [p1, p2].sort().join('+');
            const resultId = recipes[comboKey];

            const resultBox = document.getElementById('result-box');
            resultBox.style.display = 'block';

            if (resultId) {
                const resPlant = plants[resultId];
                document.getElementById('result-title').innerText = "✨ New Hybrid Discovered! ✨";
                document.getElementById('result-desc').innerHTML = `You bred a <b>${resPlant.name}</b> (${resPlant.emoji})!<br><span style="font-size:0.85rem; color:#555;">${resPlant.desc}</span>`;
                
                if (!inventory.includes(resultId)) {
                    inventory.push(resultId);
                }
                if (!unlocked.includes(resultId)) {
                    unlocked.push(resultId);
                }
            } else {
                document.getElementById('result-title').innerText = "❌ Unsuccessful Cross";
                document.getElementById('result-desc').innerText = "Nothing interesting grew from this pairing. Try a different combination!";
            }

            selectedSlots = [null, null];
            updateLabUI();
        }

        function renderGreenhouse() {
            const grid = document.getElementById('greenhouse-grid');
            grid.innerHTML = '';
            
            // Show all possible plants, greyed out if not unlocked
            Object.keys(plants).forEach(id => {
                const p = plants[id];
                const isUnlocked = unlocked.includes(id);
                
                if (isUnlocked) {
                    grid.innerHTML += `
                        <div class="plant-card" style="border-color:#27ae60;">
                            <div class="plant-emoji">${p.emoji}</div>
                            <div class="plant-name">${p.name}</div>
                        </div>
                    `;
                } else {
                    grid.innerHTML += `
                        <div class="plant-card" style="opacity: 0.4; background:#f1f1f1;">
                            <div class="plant-emoji">❓</div>
                            <div class="plant-name">Locked</div>
                        </div>
                    `;
                }
            });
        }

        // Initial render
        updateLabUI();
    </script>
</body>
</html>
