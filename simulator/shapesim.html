<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Shape Simulator</title>
<style>
    body {
        margin: 0;
        overflow: hidden;
        background-color: #1a1a1a;
        touch-action: none;
    }
    canvas {
        display: block;
    }
</style>
</head>
<body>
<canvas id="simulator"></canvas>

<script>
    const canvas = document.getElementById('simulator');
    const ctx = canvas.getContext('2d');

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    const shapes = [];
    let gravityX = 0;
    let gravityY = 0.6;
    const friction = 0.85;
    const colors = ['#FF355E', '#FD5B78', '#FF6037', '#FF9966', '#FF9933', '#FFCC33', '#FFFF66', '#CCFF00', '#66FF66', '#AAF0D1', '#50BFE6', '#FF6EFF', '#EE34D2', '#FF00CC'];

    let permissionGranted = false;

    function handleOrientation(event) {
        let x = event.gamma;
        let y = event.beta;

        if (x > 90) x = 90;
        if (x < -90) x = -90;
        if (y > 90) y = 90;
        if (y < -90) y = -90;

        gravityX = x / 45;
        gravityY = y / 45;
    }

    function rotate(velocity, angle) {
        return {
            x: velocity.x * Math.cos(angle) - velocity.y * Math.sin(angle),
            y: velocity.x * Math.sin(angle) + velocity.y * Math.cos(angle)
        };
    }

    function resolveCollision(particle, otherParticle) {
        const xVelocityDiff = particle.dx - otherParticle.dx;
        const yVelocityDiff = particle.dy - otherParticle.dy;
        const xDist = otherParticle.x - particle.x;
        const yDist = otherParticle.y - particle.y;

        if (xVelocityDiff * xDist + yVelocityDiff * yDist >= 0) {
            const angle = -Math.atan2(otherParticle.y - particle.y, otherParticle.x - particle.x);
            const m1 = particle.size;
            const m2 = otherParticle.size;

            const u1 = rotate({ x: particle.dx, y: particle.dy }, angle);
            const u2 = rotate({ x: otherParticle.dx, y: otherParticle.dy }, angle);

            const v1 = { x: u1.x * (m1 - m2) / (m1 + m2) + u2.x * 2 * m2 / (m1 + m2), y: u1.y };
            const v2 = { x: u2.x * (m1 - m2) / (m1 + m2) + u1.x * 2 * m1 / (m1 + m2), y: u2.y };

            const vFinal1 = rotate(v1, -angle);
            const vFinal2 = rotate(v2, -angle);

            particle.dx = vFinal1.x;
            particle.dy = vFinal1.y;
            otherParticle.dx = vFinal2.x;
            otherParticle.dy = vFinal2.y;
        }
    }

    class Shape {
        constructor(x, y, type) {
            this.x = x;
            this.y = y;
            this.type = type;
            this.dx = (Math.random() - 0.5) * 12;
            this.dy = (Math.random() - 0.5) * 12;
            this.size = Math.random() * 25 + 10;
            this.color = colors[Math.floor(Math.random() * colors.length)];
        }

        draw() {
            ctx.beginPath();
            ctx.fillStyle = this.color;
            
            if (this.type === 'circle') {
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
            } else if (this.type === 'square') {
                ctx.rect(this.x - this.size, this.y - this.size, this.size * 2, this.size * 2);
                ctx.fill();
            }
            
            ctx.closePath();
        }

        update() {
            this.dx += gravityX;
            this.dy += gravityY;

            if (this.y + this.size + this.dy > canvas.height) {
                this.dy = -this.dy * friction;
                this.y = canvas.height - this.size;
            } else if (this.y - this.size + this.dy < 0) {
                this.dy = -this.dy * friction;
                this.y = this.size;
            }

            if (this.x + this.size + this.dx > canvas.width) {
                this.dx = -this.dx * friction;
                this.x = canvas.width - this.size;
            } else if (this.x - this.size + this.dx < 0) {
                this.dx = -this.dx * friction;
                this.x = this.size;
            }

            this.x += this.dx;
            this.y += this.dy;

            this.draw();
        }
    }

    function spawnShape(x, y) {
        const type = Math.random() > 0.5 ? 'circle' : 'square';
        shapes.push(new Shape(x, y, type));
        
        if (!permissionGranted) {
            if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
                DeviceOrientationEvent.requestPermission()
                    .then(permissionState => {
                        if (permissionState === 'granted') {
                            window.addEventListener('deviceorientation', handleOrientation);
                        }
                    })
                    .catch(console.error);
            } else {
                window.addEventListener('deviceorientation', handleOrientation);
            }
            permissionGranted = true;
        }
    }

    window.addEventListener('mousedown', (e) => {
        spawnShape(e.clientX, e.clientY);
    });

    window.addEventListener('touchstart', (e) => {
        for (let i = 0; i < e.changedTouches.length; i++) {
            spawnShape(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
        }
    });

    window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    });

    function animate() {
        requestAnimationFrame(animate);
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        for (let i = 0; i < shapes.length; i++) {
            shapes[i].update();
        }

        for (let i = 0; i < shapes.length; i++) {
            for (let j = i + 1; j < shapes.length; j++) {
                const dx = shapes[i].x - shapes[j].x;
                const dy = shapes[i].y - shapes[j].y;
                const distance = Math.sqrt(dx * dx + dy * dy);
                const minDistance = shapes[i].size + shapes[j].size;

                if (distance < minDistance) {
                    let nx = dx / distance;
                    let ny = dy / distance;
                    
                    if (distance === 0) {
                        nx = 1;
                        ny = 0;
                    }
                    
                    const overlap = minDistance - distance;
                    
                    shapes[i].x += (nx * overlap) / 2;
                    shapes[i].y += (ny * overlap) / 2;
                    shapes[j].x -= (nx * overlap) / 2;
                    shapes[j].y -= (ny * overlap) / 2;

                    resolveCollision(shapes[i], shapes[j]);
                }
            }
        }
    }

    animate();
</script>
</body>
</html>
