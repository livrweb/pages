<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Multi-Counter Dashboard</title>
    <style>
        :root {
            --primary: #6366f1;
            --bg: #f1f5f9;
            --card-bg: #ffffff;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg);
            padding: 2rem;
            margin: 0;
        }

        .header-section {
            text-align: center;
            margin-bottom: 3rem;
            background: white;
            padding: 2rem;
            border-radius: 1rem;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        .setup-controls {
            display: flex;
            gap: 10px;
            justify-content: center;
            align-items: center;
        }

        input[type="number"] {
            padding: 0.6rem;
            border: 2px solid #e2e8f0;
            border-radius: 0.5rem;
            width: 80px;
        }

        .btn-generate {
            background: var(--primary);
            color: white;
            border: none;
            padding: 0.6rem 1.5rem;
            border-radius: 0.5rem;
            cursor: pointer;
            font-weight: 600;
        }

        #counter-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 1.5rem;
        }

        /* Individual Counter Card Styles */
        .counter-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1);
            text-align: center;
        }

        .counter-title {
            font-size: 0.9rem;
            color: #64748b;
            margin-bottom: 0.5rem;
            font-weight: bold;
        }

        .display {
            font-size: 3rem;
            font-weight: 800;
            margin: 1rem 0;
            color: #1e293b;
        }

        .step-input-group {
            margin-bottom: 1rem;
            font-size: 0.8rem;
        }

        .controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
        }

        .btn {
            padding: 0.6rem;
            border: none;
            border-radius: 0.4rem;
            cursor: pointer;
            font-weight: bold;
            transition: transform 0.1s;
        }

        .btn:active { transform: scale(0.95); }
        .btn-inc { background: #dcfce7; color: #166534; }
        .btn-dec { background: #fee2e2; color: #991b1b; }
        .btn-reset { background: #f1f5f9; color: #475569; grid-column: span 2; }
    </style>
</head>
<body>

    <div class="header-section">
        <h1>Counter Dashboard</h1>
        <div class="setup-controls">
            <label>How many counters?</label>
            <input type="number" id="count-qty" value="3" min="1" max="50">
            <button class="btn-generate" onclick="generateCounters()">Generate</button>
        </div>
    </div>

    <div id="counter-grid">
        </div>

    <script>
        const grid = document.getElementById('counter-grid');
        const qtyInput = document.getElementById('count-qty');

        function generateCounters() {
            // Clear existing
            grid.innerHTML = '';
            const qty = parseInt(qtyInput.value) || 1;

            for (let i = 1; i <= qty; i++) {
                createCounterElement(i);
            }
        }

        function createCounterElement(index) {
            const card = document.createElement('div');
            card.className = 'counter-card';
            
            // Unique internal state for this specific card
            let currentCount = 0;

            card.innerHTML = `
                <div class="counter-title">Counter #${index}</div>
                <div class="display">0</div>
                <div class="step-input-group">
                    Step: <input type="number" class="step-val" value="1" style="width: 50px;">
                </div>
                <div class="controls">
                    <button class="btn btn-dec">Decrease</button>
                    <button class="btn btn-inc">Increase</button>
                    <button class="btn btn-reset">Reset</button>
                </div>
            `;

            // Element references within this specific card
            const display = card.querySelector('.display');
            const stepInput = card.querySelector('.step-val');
            
            card.querySelector('.btn-inc').onclick = () => {
                currentCount += parseInt(stepInput.value) || 0;
                display.innerText = currentCount;
            };

            card.querySelector('.btn-dec').onclick = () => {
                currentCount -= parseInt(stepInput.value) || 0;
                display.innerText = currentCount;
            };

            card.querySelector('.btn-reset').onclick = () => {
                currentCount = 0;
                display.innerText = currentCount;
            };

            grid.appendChild(card);
        }

        // Initialize with default value
        generateCounters();
    </script>
</body>
</html>
