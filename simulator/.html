<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>"" & Nothing Simulator</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
        }

        body {
            background-color: #0b0f19;
            color: #e2e8f0;
            font-family: ui-monospace, monospace;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            touch-action: manipulation;
        }

        header {
            padding: 15px;
            text-align: center;
            border-bottom: 1px solid #1e293b;
            background: #0f172a;
        }

        h1 {
            font-size: 1.1rem;
            color: #38bdf8;
            letter-spacing: 2px;
        }

        .stats-bar {
            display: flex;
            justify-content: space-around;
            padding: 10px;
            background: #111827;
            font-size: 0.8rem;
            border-bottom: 1px solid #1e293b;
            color: #94a3b8;
        }

        .stats-bar span {
            color: #f8fafc;
            font-weight: bold;
        }

        #viewport {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            background: radial-gradient(circle at center, #111827 0%, #0b0f19 100%);
        }

        #core-display {
            font-size: 3.5rem;
            font-weight: bold;
            color: #cbd5e1;
            letter-spacing: 4px;
            transition: transform 0.1s ease;
            text-shadow: 0 0 20px rgba(56, 189, 248, 0.2);
        }

        .floating-quote {
            position: absolute;
            font-size: 1.2rem;
            color: rgba(148, 163, 184, 0.4);
            pointer-events: none;
            animation: floatUp 1.5s linear forwards;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) scale(1);
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100px) scale(1.2);
                opacity: 0;
            }
        }

        .control-panel {
            padding: 15px;
            background: #0f172a;
            border-top: 1px solid #1e293b;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        button {
            background: #1e293b;
            color: #f8fafc;
            border: 1px solid #334155;
            padding: 14px;
            font-family: inherit;
            font-size: 0.9rem;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.1s, transform 0.05s;
        }

        button:active {
            background: #334155;
            transform: scale(0.97);
        }

        button.primary {
            grid-column: span 2;
            background: #0284c7;
            border-color: #38bdf8;
            color: #ffffff;
            font-weight: bold;
        }

        button.primary:active {
            background: #0369a1;
        }

        #console-log {
            position: absolute;
            bottom: 80px;
            left: 15px;
            right: 15px;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #334155;
            padding: 8px 12px;
            font-size: 0.75rem;
            border-radius: 4px;
            color: #38bdf8;
            text-align: center;
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <header>
        <h1>"" & NOTHING SIMULATOR</h1>
    </header>

    <div class="stats-bar">
        <div>Nothingness: <span id="stat-nothing">0%</span></div>
        <div>Quotes Generated: <span id="stat-quotes">0</span></div>
        <div>Length: <span id="stat-length">4</span></div>
    </div>

    <div id="viewport" id="tap-area">
        <div id="core-display">"  "</div>
        <div id="console-log">System: Absolute void detected.</div>
    </div>

    <div class="control-panel">
        <button id="btn-quote" class="primary">Tap to Inject ""</button>
        <button id="btn-space">Add Space</button>
        <button id="btn-collapse">Collapse Void</button>
    </div>

    <script>
        const coreDisplay = document.getElementById('core-display');
        const viewport = document.getElementById('viewport');
        const consoleLog = document.getElementById('console-log');
        
        const statNothing = document.getElementById('stat-nothing');
        const statQuotes = document.getElementById('stat-quotes');
        const statLength = document.getElementById('stat-length');

        let spacesCount = 2;
        let quotesGenerated = 0;
        let nothingLevel = 0;

        function updateDisplay() {
            let padding = ' '.repeat(spacesCount);
            coreDisplay.textContent = `"${padding}"`;
            statLength.textContent = coreDisplay.textContent.length;
            statQuotes.textContent = quotesGenerated;
            statNothing.setAttribute('style', `color: ${nothingLevel > 80 ? '#ef4444' : '#38bdf8'}`);
            statNothing.textContent = `${nothingLevel}%`;
        }

        function spawnFloatingText(x, y, text) {
            const el = document.createElement('div');
            el.className = 'floating-quote';
            el.textContent = text;
            el.style.left = `${x}px`;
            el.style.top = `${y}px`;
            viewport.appendChild(el);
            setTimeout(() => el.remove(), 1500);
        }

        function logMessage(msg) {
            consoleLog.textContent = msg;
            consoleLog.style.opacity = '1';
            setTimeout(() => {
                consoleLog.style.opacity = '0';
            }, 1200);
        }

        // Tap interactions
        viewport.addEventListener('click', (e) => {
            const rect = viewport.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            quotesGenerated++;
            nothingLevel = Math.min(100, nothingLevel + 2);
            
            // Pop effect
            coreDisplay.style.transform = 'scale(1.08)';
            setTimeout(() => coreDisplay.style.transform = 'scale(1)', 80);

            const options = ['""', '" "', '"  "', 'ø', '...'];
            const randomPick = options[Math.floor(Math.random() * options.length)];
            spawnFloatingText(x, y, randomPick);
            updateDisplay();
        });

        document.getElementById('btn-quote').addEventListener('click', (e) => {
            e.stopPropagation();
            quotesGenerated++;
            nothingLevel = Math.min(100, nothingLevel + 5);
            logMessage("Status: Generated empty wrapper.");
            updateDisplay();
        });

        document.getElementById('btn-space').addEventListener('click', (e) => {
            e.stopPropagation();
            spacesCount = (spacesCount % 8) + 1;
            nothingLevel = Math.max(0, nothingLevel - 3);
            logMessage(`Status: Adjusted internal spacing to ${spacesCount}.`);
            updateDisplay();
        });

        document.getElementById('btn-collapse').addEventListener('click', (e) => {
            e.stopPropagation();
            spacesCount = 0;
            nothingLevel = 100;
            logMessage("WARNING: Pure Void Achieved. Absolutely Nothing.");
            updateDisplay();
        });

        updateDisplay();
    </script>
</body>
</html>
