name: Build music/tracks.json

on:
  push:
    paths:
      - "music/**"
      - "!music/tracks.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tracks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate tracks.json
        run: |
          pip install mutagen
          python - <<'EOF'
          import json, pathlib
          from urllib.parse import quote
          from mutagen import File

          EXT = {".mp3", ".wav", ".ogg", ".m4a", ".flac", ".aac", ".opus"}
          root = pathlib.Path("music")
          tracks = []

          for p in sorted(root.rglob("*")):
              if not p.is_file() or p.suffix.lower() not in EXT:
                  continue
              title = artist = album = None
              duration = 0
              try:
                  m = File(p, easy=True)
                  if m is not None:
                      if m.info and getattr(m.info, "length", None):
                          duration = round(m.info.length, 2)
                      tags = m.tags or {}
                      first = lambda k: (tags.get(k) or [None])[0]
                      title, artist, album = first("title"), first("artist"), first("album")
              except Exception as e:
                  print(f"No metadata for {p}: {e}")

              entry = {
                  "file": quote(p.relative_to(root).as_posix()),
                  "title": title or p.stem.replace("_", " "),
                  "duration": duration,
              }
              if artist:
                  entry["artist"] = artist
              if album:
                  entry["album"] = album
              tracks.append(entry)

          (root / "tracks.json").write_text(json.dumps(tracks, indent=2, ensure_ascii=False) + "\n")
          print(f"Wrote {len(tracks)} tracks")
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/tracks.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update music/tracks.json"
            git push
          fi
